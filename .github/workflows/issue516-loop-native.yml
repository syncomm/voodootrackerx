name: issue516-loop-native

on:
  pull_request:
    branches: [main]

jobs:
  host-progress-control:
    name: Standalone CoreAudio arm64 progress control
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Exercise DefaultOutput without VTX code
        run: |
          test "$(uname -m)" = arm64
          vtx_probe_root=$(mktemp -d /private/tmp/vtx-host-progress.XXXXXX)
          sw_vers > "$vtx_probe_root/driver-provenance.txt"
          vtx_driver=/System/Library/Audio/Plug-Ins/HAL/AppleVirtIOSound.driver/Contents
          if test -f "$vtx_driver/MacOS/AppleVirtIOSound"; then
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$vtx_driver/Info.plist" >> "$vtx_probe_root/driver-provenance.txt"
            shasum -a 256 "$vtx_driver/MacOS/AppleVirtIOSound" >> "$vtx_probe_root/driver-provenance.txt"
            dwarfdump --uuid "$vtx_driver/MacOS/AppleVirtIOSound" >> "$vtx_probe_root/driver-provenance.txt"
          fi
          clang -arch arm64 -std=c11 -Wall -Wextra -Werror \
            .github/scripts/issue554-host-progress.c \
            -framework AudioToolbox -framework CoreAudio \
            -o "$vtx_probe_root/host-progress"
          file "$vtx_probe_root/host-progress" > "$vtx_probe_root/image.txt"
          set +e
          "$vtx_probe_root/host-progress" > "$vtx_probe_root/progress.log" 2>&1
          vtx_probe_result=$?
          "$vtx_probe_root/host-progress" --rapid-restart > "$vtx_probe_root/rapid-progress.log" 2>&1
          vtx_rapid_result=$?
          printf 'baselineExit=%s rapidExit=%s\n' "$vtx_probe_result" "$vtx_rapid_result" > "$vtx_probe_root/results.txt"
          /usr/bin/log show --last 10m --style compact \
            --predicate 'process == "coreaudiod" OR process == "host-progress"' \
            > "$vtx_probe_root/host-system.log" 2>&1
          test "$vtx_probe_result" = 0 && test "$vtx_rapid_result" = 0
      - name: Preserve standalone host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-host-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: /private/tmp/vtx-host-progress.*
          if-no-files-found: warn
  continuation:
    name: Loop continuation arm64 ASan and Release
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Qualify submitted native workload and optimized guards
        run: python3 .github/scripts/issue516-loop-native-ci.py
      - name: Preserve public synthetic CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue516-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: /private/tmp/vtx-loop-native-ci-*
          if-no-files-found: warn
