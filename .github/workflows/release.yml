name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version label for the package-only dry run"
        required: true
        default: "v0.0.0-local"

permissions:
  contents: write

jobs:
  macos-dmg:
    name: Build macOS DMG
    runs-on: macos-26

    env:
      APP_NAME: VoodooTrackerX
      APP_PATH: build-release/Build/Products/Release/VoodooTrackerX.app
      DIST_DIR: dist
      DMG_PATH: dist/VoodooTrackerX-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}.dmg
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      SIGNING_IDENTITY: Developer ID Application

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure signing temp paths
        run: |
          set -euo pipefail
          echo "CERTIFICATE_PATH=$RUNNER_TEMP/developer-id-application.p12" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/vtx-signing.keychain-db" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version

      - name: Import Developer ID certificate
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail

          required_secrets=(
            APPLE_DEVELOPER_ID_CERTIFICATE_BASE64
            APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD
            APPLE_TEAM_ID
            APPLE_ID
            APPLE_APP_SPECIFIC_PASSWORD
            APPLE_KEYCHAIN_PASSWORD
          )

          missing_secrets=()
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name:-}" ]]; then
              missing_secrets+=("$secret_name")
            fi
          done

          if (( ${#missing_secrets[@]} > 0 )); then
            echo "Missing required GitHub Secrets for signed notarized tag release:" >&2
            printf '  - %s\n' "${missing_secrets[@]}" >&2
            exit 1
          fi

          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"

          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$APPLE_KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build Release app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            xcodebuild \
              -project app/VoodooTrackerX/VoodooTrackerX.xcodeproj \
              -scheme VoodooTrackerX \
              -configuration Release \
              -destination 'generic/platform=macOS' \
              -derivedDataPath build-release \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
              ENABLE_HARDENED_RUNTIME=YES \
              CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
              OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime" \
              ARCHS="arm64 x86_64" \
              ONLY_ACTIVE_ARCH=NO \
              build
          else
            xcodebuild \
              -project app/VoodooTrackerX/VoodooTrackerX.xcodeproj \
              -scheme VoodooTrackerX \
              -configuration Release \
              -destination 'generic/platform=macOS' \
              -derivedDataPath build-release \
              CODE_SIGNING_ALLOWED=NO \
              ARCHS="arm64 x86_64" \
              ONLY_ACTIVE_ARCH=NO \
              build
          fi

      - name: Verify app architecture
        run: |
          set -euo pipefail
          lipo -info "$APP_PATH/Contents/MacOS/$APP_NAME"

      - name: Verify app signature
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          app_signature_details="$RUNNER_TEMP/vtx-app-codesign-details.txt"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee "$app_signature_details"
          grep -q '^TeamIdentifier=' "$app_signature_details"
          grep -q '^Runtime Version=' "$app_signature_details"
          grep -q '^Timestamp=' "$app_signature_details"

          app_entitlements="$RUNNER_TEMP/vtx-app-entitlements.plist"
          codesign -d --entitlements :- "$APP_PATH" > "$app_entitlements" 2>/dev/null
          cat "$app_entitlements"
          if plutil -extract com.apple.security.get-task-allow raw -o - "$app_entitlements" >/dev/null 2>&1; then
            echo "Forbidden entitlement is present: com.apple.security.get-task-allow" >&2
            exit 1
          fi

      - name: Package DMG
        run: |
          set -euo pipefail
          scripts/package-macos-dmg.sh "$APP_PATH" "$RELEASE_TAG" "$DIST_DIR"

      - name: Sign DMG
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          set -euo pipefail
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"
          codesign -dv --verbose=4 "$DMG_PATH"

      - name: Notarize DMG
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

      - name: Staple DMG
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          set -euo pipefail
          xcrun stapler staple "$DMG_PATH"

      - name: Verify final DMG
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          set -euo pipefail
          spctl -a -vvv -t open --context context:primary-signature "$DMG_PATH"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: VoodooTrackerX-${{ env.RELEASE_TAG }}-dmg
          path: ${{ env.DIST_DIR }}/VoodooTrackerX-${{ env.RELEASE_TAG }}.dmg
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        # softprops/action-gh-release v3
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          tag_name: ${{ github.ref_name }}
          name: VoodooTracker X ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ env.DIST_DIR }}/VoodooTrackerX-${{ github.ref_name }}.dmg

      - name: Clean up signing keychain
        if: always() && github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          set -euo pipefail
          rm -f "$CERTIFICATE_PATH"
          security delete-keychain "$KEYCHAIN_PATH" || true
